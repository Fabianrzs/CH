# Terminación TLS para Azure.Messaging.ServiceBus 7.9.0 (GA2), que exige HTTPS (443) y AMQPS (5671).
# El emulador sólo expone HTTP (5300) y AMQP sin TLS (5672).
events {}

# Administración (reglas): el emulador rechaza con 400 cualquier Host distinto de localhost.
http {
  server {
    listen 443 ssl;
    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;

    location / {
      proxy_pass http://servicebus-emulator:5300;
      proxy_set_header Host localhost;
      proxy_http_version 1.1;
    }
  }
}

stream {
  server {
    listen 5671 ssl;
    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    proxy_pass servicebus-emulator:5672;
  }
}
