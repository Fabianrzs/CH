# Terminación TLS para clientes Azure.Messaging.ServiceBus < 7.18 (GA2 usa 7.9.0), que no soportan
# UseDevelopmentEmulator: exigen HTTPS (administración, 443) y AMQPS (5671). El emulador sólo expone
# HTTP (5300) y AMQP sin TLS (5672). Sólo para entornos de prueba locales.
events {}

stream {
  upstream sb_management { server 127.0.0.1:5300; }
  upstream sb_amqp { server 127.0.0.1:5672; }

  server {
    listen 127.0.0.1:443 ssl;
    ssl_certificate     /certs/servicebus-local.crt;
    ssl_certificate_key /certs/servicebus-local.key;
    proxy_pass sb_management;
  }

  server {
    listen 127.0.0.1:5671 ssl;
    ssl_certificate     /certs/servicebus-local.crt;
    ssl_certificate_key /certs/servicebus-local.key;
    proxy_pass sb_amqp;
  }
}
